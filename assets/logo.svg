<!--
  Zota Furniture & Interior — brand mark.
  Vector recreation of the supplied logo: a navy (#14395E) angular leg on a
  wide base, interlocking with an orange (#F0912D) chevron. Both carry the
  brand's diagonal slot cut, left as real gaps rather than white overlays so
  the mark reads correctly on any background colour.

  This is a hand-traced recreation. To use the original artwork, drop it in
  beside this file as logo.png and repoint the two <img class="brand-logo">
  tags in each HTML file — see zota/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="264" viewBox="0 0 400 264" role="img" aria-label="Zota Furniture &amp; Interior">
  <title>Zota Furniture &amp; Interior</title>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4">
    <path d="M182 22 L115 112" stroke="#14395E" stroke-width="58"/>
    <path d="M102 128 L32 222 L185 222" stroke="#14395E" stroke-width="58"/>
    <path d="M270 40 L198 140 L250 165" stroke="#F0912D" stroke-width="54"/>
    <path d="M262 170 L370 222" stroke="#F0912D" stroke-width="54"/>
  </g>
</svg>
